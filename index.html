<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kur — Avrupa Merkez Bankası verileriyle döviz çevirici, kur tablosu, geçmiş grafikleri ve kur alarmları." />
    <meta name="theme-color" content="#0b0f14" />
    <title>Kur · Döviz Çevirici & Analiz</title>
    <script>
      try {
        var t = (JSON.parse(localStorage.getItem('kur-store') || '{}').state || {}).theme
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
